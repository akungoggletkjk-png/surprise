<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Cimol</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffd6e7, #ffeef5);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }.card {
    text-align: center;
    padding: 20px;
    max-width: 90vw;
    z-index: 2;
}

h1 {
    color: #ff4d88;
    font-size: 26px;
}

button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

.yes {
    background: #ff6fae;
    color: white;
}

.no {
    background: #fff;
    color: #ff4d88;
    border: 2px solid #ff4d88;
    position: relative;
}

.hidden { display: none; }
.big { transform: scale(1.3); }

/* INTRO */
#intro {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #ffb6d5, #ffe3ef);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
    color: #fff;
    text-align: center;
    transition: opacity 1.5s ease;
}

#intro h2 { font-size: 20px; }

/* HEARTS */
.heart {
    position: fixed;
    top: -10px;
    color: rgba(255,105,180,0.7);
    font-size: 16px;
    animation: fall linear forwards;
    z-index: 1;
    pointer-events: none;
}

@keyframes fall {
    to { transform: translateY(110vh); }
}

/* EMOJI CAT */
.cat-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.cat{
    font-size: 95px;
    cursor:pointer;
    animation:bounce 1.4s infinite;
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
    transition: transform 0.2s ease;
    user-select:none;
}

.cat:hover{
    transform: scale(1.12);
}

.hint{
    margin-top:10px;
    color:#d63384;
    font-size:14px;
}

@keyframes bounce{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
}

/* LETTER */
.letter{
    background:#fff;
    padding:20px;
    border-radius:10px;
    max-width:500px;
    margin-top:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    color:#d63384;
    white-space:pre-wrap;
    line-height:1.5;
    display:none;
}

</style>
</head>
<body><div id="intro">
    <h2>untuk seseorang yang paling aku sayanggg…</h2>
</div><div id="step1" class="card hidden">
    <h1>Halo kamu… kangen aku gak?</h1>
    <button class="yes" onclick="nextStep()">Iya</button>
    <button class="no" id="noBtn">Engga</button>
</div><div id="step2" class="card hidden">
    <h1>Beneran kangen aku?</h1>
    <button class="yes" onclick="finalStep()" id="yes2">Iya</button>
    <button class="yes" onclick="finalStep()">Iya banget</button>
</div><div id="step3" class="card hidden">
    <div class="cat-wrap">
        <div class="cat" onclick="openLetter(); playMeow();">🐱</div>
        <div class="hint">klik aku ya…</div>
        <div class="letter" id="letter"></div>
    </div>
</div><script>
window.onload = () => {
    setTimeout(() => {
        document.getElementById('intro').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('step1').classList.remove('hidden');
        }, 1500);
    }, 2000);
};

const noBtn = document.getElementById('noBtn');
noBtn.addEventListener('mouseover', () => {
    noBtn.style.position = 'absolute';
    noBtn.style.top = Math.random() * 80 + 'vh';
    noBtn.style.left = Math.random() * 80 + 'vw';
});

function nextStep() {
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
    document.getElementById('yes2').classList.add('big');
}

function finalStep() {
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step3').classList.remove('hidden');
    startHearts();
}

function openLetter() {
    const letter = document.getElementById('letter');
    letter.style.display = 'block';
    typeWriter();
}

// SIMPLE AUDIO (NO FILE NEEDED)
function playMeow() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(600, ctx.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.2);

    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start();
    oscillator.stop(ctx.currentTime + 0.25);
}

const message = `Dari aku untukmu
aku titipkan kata kata ini pada angin, agar ia berbisik lembut ke telingamu, mengabarkan rindu yang tak pernah habis, menitipkan cinta yang tak pernah suram, aku selipkan doa disetiap malamku, memintakan kebahagiaan untukmu, bahkan, jika aku tak lagi di sisimu, aku ingin kau tetap tersenyum. dari aku untukmu, sebuah hati yang telah lelah mencari, sebuah jiwa yang hanya ingin menetap, dan sebuah cinta yang tak mengenal akhir, jika dunia ini terlalu luas, aku ingin menjadi alasan kecilmu, tempat kau pulang, tempat kau merasa aman. dari aku untukmu, segala yang kumiliki, meski tak sempurna, aku berikan semuanya.

aku sayang banget sama kamu, lebih dari apa yang kamu tauu.`;

let i = 0;
function typeWriter() {
    if (i < message.length) {
        document.getElementById("letter").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, 25);
    }
}

function startHearts() {
    setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '❤';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (3 + Math.random() * 3) + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }, 300);
}
</script></body>
</html>
